// SPDX-License-Identifier: MPL-2.0

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "ApothicAscension-mc${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        name = 'ShadowsOfFire'
        url = 'https://maven.shadowsoffire.dev/releases'
        content { includeGroup 'dev.shadowsoffire' }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'vazkii.patchouli'
            includeGroup 'net.darkhax.bookshelf'
            includeGroup 'net.darkhax.pricklemc'
        }
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"

    implementation "dev.shadowsoffire:Placebo:${placebo_version}"
    implementation "dev.shadowsoffire:ApothicAttributes:${apothic_attributes_version}"
    implementation "dev.shadowsoffire:ApothicSpawners:${apothic_spawners_version}"
    implementation "dev.shadowsoffire:ApothicEnchanting:${apothic_enchanting_version}"
    implementation "dev.shadowsoffire:Apotheosis:${apotheosis_version}"

    // JEI is an optional client integration. Only its API is required to compile the source.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version_range: minecraft_version_range,
        loader_version_range: loader_version_range,
        neo_version: neo_version,
        neo_version_range: neo_version_range,
        apotheosis_version_range: apotheosis_version_range,
        placebo_version_range: placebo_version_range,
        apothic_attributes_version_range: apothic_attributes_version_range,
        jei_version_range: jei_version_range,
        ars_nouveau_version_range: ars_nouveau_version_range,
        irons_spellbooks_version_range: irons_spellbooks_version_range,
        spartan_weaponry_unofficial_version_range: spartan_weaponry_unofficial_version_range,
        allthemodium_version_range: allthemodium_version_range,
        simplyswords_version_range: simplyswords_version_range,
        silentgear_version_range: silentgear_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar', Jar).configure {
    archiveBaseName = "ApothicAscension-mc${minecraft_version}"
    manifest.attributes(
        'Implementation-Title': mod_name,
        'Implementation-Version': mod_version,
        'Built-Against-Minecraft': minecraft_version,
        'Built-Against-NeoForge': neo_version
    )
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xlint:all,-processing,-serial']
}
