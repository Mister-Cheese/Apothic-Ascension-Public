name: Compatibility report
description: Report an interaction with another mod
title: "[Compat]: "
body:
  - type: input
    id: aa-version
    attributes:
      label: Apothic Ascension version
    validations:
      required: true
  - type: input
    id: other-mod
    attributes:
      label: Other mod and exact version
      placeholder: Mod Name 1.2.3
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Minecraft / NeoForge / Apotheosis versions
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Interaction
      description: Describe the conflict, missing behavior, or unexpected ownership/category result.
    validations:
      required: true
  - type: textarea
    id: minimal
    attributes:
      label: Minimal reproduction
      description: List the smallest mod set and steps that reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Attach logs if they contain useful diagnostics.