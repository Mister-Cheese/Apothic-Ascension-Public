name: Bug report
description: Report a reproducible Apothic Ascension defect
title: "[Bug] "
body:
  - type: input
    id: aa-version
    attributes:
      label: Apothic Ascension version
      placeholder: e.g. 1.14.0-Beta
    validations:
      required: true
  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      placeholder: e.g. 1.21.1
    validations:
      required: true
  - type: input
    id: neoforge-version
    attributes:
      label: NeoForge version
    validations:
      required: true
  - type: input
    id: apotheosis-version
    attributes:
      label: Apotheosis version
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the shortest reliable sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or crash report
      description: Attach or paste only the relevant log/crash material. Remove credentials or private server information first.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I verified that this report does not contain passwords, tokens, private addresses, or other secrets.
          required: true
