name: Bug report
description: Report a reproducible Apothic Ascension defect
title: "[Bug]: "
body:
  - type: input
    id: aa-version
    attributes:
      label: Apothic Ascension version
      placeholder: 1.14.0-Beta
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Minecraft / NeoForge / Apotheosis versions
      placeholder: Minecraft 1.21.1, NeoForge 21.1.x, Apotheosis 8.x
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the shortest reliable reproduction you have.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or crash report
      description: Paste a short relevant excerpt or attach the full latest.log/crash report.